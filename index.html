<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/gs-monogram.svg" />
    <meta
      name="description"
      content="Gurpreet Singh is a Software Development Engineer III building reliable enterprise software, scalable systems, and intuitive digital experiences."
    />
    <meta name="theme-color" content="#F7F6F1" />
    <script>
      const prefersDark = window.matchMedia
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
        : false
      const systemTheme = prefersDark ? 'dark' : 'light'
      let savedTheme = null

      try {
        savedTheme = window.localStorage.getItem('portfolio-theme')
      } catch (error) {
        console.warn('Unable to read the theme preference.', error)
      }

      const theme =
        savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : systemTheme

      document.documentElement.dataset.theme = theme
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', theme === 'dark' ? '#151A17' : '#F7F6F1')
    </script>
    <title>Gurpreet Singh | Software Development Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
